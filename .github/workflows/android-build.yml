name: Build Android APK (GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., "1.0.0")'
        required: true
        default: "1.0.0"
      version_code:
        description: 'Version code (int, e.g., 1)'
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (via AdoptOpenJDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      # 3. Setup Android SDK (minimal for building)
      - name: Setup Android SDK
        uses: /home/sherman/android-sdk-setup@v1.0.1
        # Fallback manual setup if external action not available:
        # Run this if needed (below is commented):
        # run: |
        #   # Download Android SDK command-line tools
        #   wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        #   unzip -q /tmp/cmdline-tools.zip -d $HOME/
        #   export ANDROID_HOME=$HOME/cmdline-tools
        #   mkdir -p $ANDROID_HOME/cmdline-tools/bin
        #   cat <<EOF > $ANDROID_HOME/cmdline-tools/bin/sdkmanager <<'EOS'
        #   #!/usr/bin/env bash
        #   exec /home/runner/.android/cmdline-tools/bin/sdkmanager "$@"
        #   EOS
        #   chmod +x $ANDROID_HOME/cmdline-tools/bin/sdkmanager
        #   export PATH=$ANDROID_HOME/cmdline-tools:$PATH
        #   # Install platform tools and build-tools
        #   $ANDROID_HOME/cmdline-tools/sdkmanager "platforms;android-34" "platform-tools" "build-tools;34.0.0"
        #   echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      # 4. Configure gradle to use local SDK + read minSdk from gradle file
      - name: Configure gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/depressometer-android/local.properties

      # 5. Assemble the APK (debug for quick test)
      - name: Build debug APK
        run: |
          cd depressometer-android
          ./gradlew assembleDebug --stacktrace

      # 6. (Optional) Sign the APK for Play Store or sharing
      - name: Sign APK (debug key)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Ensure debug key exists, otherwise generate
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore $HOME/.android/debug.keystore -keyalg RSA -alias debug -keystorepass android -keypass android -validity 10000 -dname "CN=Debug, OU=Test, O=Test, L=Test, ST=Test, C=US"
          fi
          cd depressometer-android
          ./gradlew signApkDebug --stacktrace

      # 7. Upload APK as workflow artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: depressometer-android/app/build/outputs/apk/debug/*.apk

